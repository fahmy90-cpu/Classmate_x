name: Build APK from AAB
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Download bundletool
        run: |
          wget https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar
          
      - name: Build APKs from AAB
        run: |
          java -jar bundletool.jar build-apks --bundle=ClassmateX.aab --output=app.apks --mode=universal
          unzip app.apks -d output
          
      - name: Sign APK with Debug Key
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore -storepass android output/universal.apk androiddebugkey
          mv output/universal.apk ClassmateX-universal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassmateX-APK
          path: ClassmateX-universal.apk
